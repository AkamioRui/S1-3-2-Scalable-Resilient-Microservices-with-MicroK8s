<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StockWatch · Live Market Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #080c12;
    --surface: #0f1520;
    --surface2: #151d2e;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --green: #00e676;
    --red: #ff3d71;
    --yellow: #ffd740;
    --text: #e8edf5;
    --muted: #4a6080;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* animated grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,12,18,0.9);
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo-text {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .logo-text span { color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    letter-spacing: 1px;
  }

  .live-dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .refresh-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.2s;
  }

  .refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ticker cards */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 48px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    animation: fadeUp 0.4s ease both;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .card:hover::before { opacity: 1; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-ticker {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .card-ts {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    margin-bottom: 20px;
  }

  .card-price {
    font-family: var(--mono);
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .card-ohlc {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
    padding: 12px;
    background: var(--surface2);
    border-radius: 8px;
  }

  .ohlc-item { font-size: 12px; }
  .ohlc-label { color: var(--muted); font-size: 10px; font-family: var(--mono); letter-spacing: 1px; }
  .ohlc-val { font-family: var(--mono); font-weight: 700; margin-top: 2px; }

  .card-analysis {
    border-top: 1px solid var(--border);
    padding-top: 14px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .analysis-item { text-align: center; }
  .analysis-label { font-size: 9px; font-family: var(--mono); letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .analysis-val { font-family: var(--mono); font-size: 13px; font-weight: 700; margin-top: 4px; }

  .rsi-low  { color: var(--green); }
  .rsi-high { color: var(--red); }
  .rsi-mid  { color: var(--yellow); }

  .no-data { color: var(--muted); font-size: 11px; }

  /* tables */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 48px;
  }

  .table-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .table-title {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .table-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    padding: 12px 24px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 12px 24px;
    border-bottom: 1px solid rgba(30,45,69,0.5);
    font-family: var(--mono);
    font-size: 12px;
  }

  tr:last-child td { border-bottom: none; }

  tr:hover td { background: rgba(0,212,255,0.03); }

  .ticker-badge {
    display: inline-block;
    background: rgba(0,212,255,0.1);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
  }

  .up   { color: var(--green); }
  .down { color: var(--red); }

  /* empty/loading state */
  .empty-state {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
  }

  .empty-state .icon { font-size: 32px; margin-bottom: 12px; }

  .tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
  }

  .tab {
    padding: 8px 20px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.5px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
    background: transparent;
    color: var(--muted);
  }

  .tab.active {
    background: var(--surface2);
    border-color: var(--border);
    color: var(--accent);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📈</div>
    <div class="logo-text">Stock<span>Watch</span></div>
  </div>
  <div class="header-right">
    <div class="live-badge">
      <div class="live-dot"></div>
      LIVE
    </div>
    <button class="refresh-btn" onclick="loadAll()">⟳ REFRESH</button>
  </div>
</header>

<main>
  <!-- Summary Cards -->
  <div class="section-label">Market Overview</div>
  <div class="cards-grid" id="cards">
    <div class="empty-state"><div class="icon">⏳</div>Loading...</div>
  </div>

  <!-- Tabs for tables -->
  <div class="section-label">Data Explorer</div>
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('prices')">Price History</button>
    <button class="tab" onclick="switchTab('analysis')">Technical Analysis</button>
  </div>

  <div id="tab-prices" class="tab-content active">
    <div class="table-wrap">
      <div class="table-header">
        <div class="table-title">STOCK_PRICES</div>
        <div class="table-count" id="prices-count">—</div>
      </div>
      <div id="prices-table"></div>
    </div>
  </div>

  <div id="tab-analysis" class="tab-content">
    <div class="table-wrap">
      <div class="table-header">
        <div class="table-title">STOCK_ANALYSIS</div>
        <div class="table-count" id="analysis-count">—</div>
      </div>
      <div id="analysis-table"></div>
    </div>
  </div>
</main>

<script>
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['prices','analysis'][i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

function fmt(n, dec=2) {
  if (n == null) return '<span class="no-data">—</span>';
  return parseFloat(n).toFixed(dec);
}

function fmtTs(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString();
}

function rsiClass(rsi) {
  if (rsi == null) return '';
  if (rsi < 30) return 'rsi-low';
  if (rsi > 70) return 'rsi-high';
  return 'rsi-mid';
}

async function loadSummary() {
  const res = await fetch('/api/summary');
  const data = await res.json();
  const grid = document.getElementById('cards');

  if (!data.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div>No data yet. Scrapper is collecting...</div>';
    return;
  }

  grid.innerHTML = data.map((d, i) => `
    <div class="card" style="animation-delay:${i*0.07}s">
      <div class="card-ticker">${d.ticker}</div>
      <div class="card-ts">${fmtTs(d.ts)}</div>
      <div class="card-price">$${fmt(d.close)}</div>
      <div class="card-ohlc">
        <div class="ohlc-item"><div class="ohlc-label">OPEN</div><div class="ohlc-val">$${fmt(d.open)}</div></div>
        <div class="ohlc-item"><div class="ohlc-label">HIGH</div><div class="ohlc-val up">$${fmt(d.high)}</div></div>
        <div class="ohlc-item"><div class="ohlc-label">LOW</div><div class="ohlc-val down">$${fmt(d.low)}</div></div>
        <div class="ohlc-item"><div class="ohlc-label">VOL</div><div class="ohlc-val">${d.volume ? Number(d.volume).toLocaleString() : '—'}</div></div>
      </div>
      <div class="card-analysis">
        <div class="analysis-item">
          <div class="analysis-label">RSI</div>
          <div class="analysis-val ${rsiClass(d.rsi)}">${fmt(d.rsi, 1)}</div>
        </div>
        <div class="analysis-item">
          <div class="analysis-label">MA50</div>
          <div class="analysis-val">${fmt(d.ma_50)}</div>
        </div>
        <div class="analysis-item">
          <div class="analysis-label">MACD</div>
          <div class="analysis-val">${fmt(d.macd, 4)}</div>
        </div>
      </div>
    </div>
  `).join('');
}

async function loadPrices() {
  const res = await fetch('/api/prices');
  const data = await res.json();
  document.getElementById('prices-count')`${data.length} rows`;
  document.getElementById('prices-count').textContent = data.length + ' rows';

  if (!data.length) {
    document.getElementById('prices-table').innerHTML =
      '<div class="empty-state"><div class="icon">📭</div>No price data yet.</div>';
    return;
  }

  document.getElementById('prices-table').innerHTML = `
    <table>
      <thead><tr>
        <th>Ticker</th><th>Timestamp</th><th>Open</th>
        <th>High</th><th>Low</th><th>Close</th><th>Volume</th>
      </tr></thead>
      <tbody>
        ${data.map(r => `<tr>
          <td><span class="ticker-badge">${r.ticker}</span></td>
          <td>${fmtTs(r.ts)}</td>
          <td>$${fmt(r.open)}</td>
          <td class="up">$${fmt(r.high)}</td>
          <td class="down">$${fmt(r.low)}</td>
          <td>$${fmt(r.close)}</td>
          <td>${Number(r.volume).toLocaleString()}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

async function loadAnalysis() {
  const res = await fetch('/api/analysis');
  const data = await res.json();
  document.getElementById('analysis-count').textContent = data.length + ' rows';

  if (!data.length) {
    document.getElementById('analysis-table').innerHTML =
      '<div class="empty-state"><div class="icon">📊</div>No analysis data yet. Waiting for analyzer...</div>';
    return;
  }

  document.getElementById('analysis-table').innerHTML = `
    <table>
      <thead><tr>
        <th>Ticker</th><th>Timestamp</th><th>RSI</th>
        <th>MA 50</th><th>MA 200</th><th>MACD</th><th>Signal</th>
      </tr></thead>
      <tbody>
        ${data.map(r => `<tr>
          <td><span class="ticker-badge">${r.ticker}</span></td>
          <td>${fmtTs(r.ts)}</td>
          <td class="${rsiClass(r.rsi)}">${fmt(r.rsi, 1)}</td>
          <td>$${fmt(r.ma_50)}</td>
          <td>$${fmt(r.ma_200)}</td>
          <td>${fmt(r.macd, 4)}</td>
          <td>${fmt(r.signal_line, 4)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

async function loadAll() {
  await Promise.all([loadSummary(), loadPrices(), loadAnalysis()]);
}

loadAll();
setInterval(loadAll, 30000); // auto-refresh tiap 30 detik
</script>
</body>
</html>
